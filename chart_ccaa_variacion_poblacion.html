<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variación de población prevista 2026–2041 · por CCAA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#16323A;
    --ink-soft:#3C5560;
    --paper:#EAEFEE;
    --card:#FBFAF7;
    --border:#DCE3E1;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    font-feature-settings:'tnum' 1;
  }
  .wrap{max-width:900px;margin:0 auto;padding:28px 24px 48px;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px 24px 16px;
  }
  .card-head{margin-bottom:14px;}
  .card-head h2{font-size:17px;margin:0 0 4px;font-weight:700;color:var(--ink);}
  .card-head .caption{font-size:12.5px;color:var(--ink-soft);}
  .chart-box{position:relative;width:100%;height:600px;}
  .legend-note{font-size:12px;color:var(--ink-soft);margin-top:10px;}
  .legend-note span{display:inline-flex;align-items:center;gap:5px;margin-right:14px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  footer{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:16px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="card-head">
      <h2>Posición de las Illes Balears entre comunidades autónomas</h2>
      <div class="caption">Variación de población prevista entre 2026 y 2041</div>
    </div>
    <div class="chart-box"><canvas id="canvasBar"></canvas></div>
    <div class="legend-note">
      <span><span class="dot" style="background:#D97A53"></span>Illes Balears</span>
      <span><span class="dot" style="background:#16323A"></span>España (total)</span>
      <span><span class="dot" style="background:#A9BCC1"></span>Resto de CCAA</span>
    </div>
  </div>
  <footer>Fuente: INE — Proyección de la población de España 2026-2076, resultados por comunidades autónomas. Datos consultados el 18/06/2026.</footer>
</div>
<script>
function fmt(n){ return n.toLocaleString('es-ES', {maximumFractionDigits:1}); }

var regions = [
  {name:"España (total)",      type:"national", v2026:49590099, v2041:53841249},
  {name:"Andalucía",           type:"normal",   v2026:8748692,  v2041:9140631},
  {name:"Aragón",              type:"normal",   v2026:1381809,  v2041:1460000},
  {name:"Asturias",            type:"normal",   v2026:1021569,  v2041:1005041},
  {name:"Baleares (Islas)",    type:"ib",       v2026:1260004,  v2041:1463575},
  {name:"Canarias",            type:"normal",   v2026:2275864,  v2041:2499617},
  {name:"Cantabria",           type:"normal",   v2026:597067,   v2041:608662},
  {name:"Castilla y León",     type:"normal",   v2026:2418632,  v2041:2395586},
  {name:"Castilla-La Mancha",  type:"normal",   v2026:2154740,  v2041:2327836},
  {name:"Cataluña",            type:"normal",   v2026:8201735,  v2041:9205897},
  {name:"Comunitat Valenciana",type:"normal",   v2026:5528180,  v2041:6432276},
  {name:"Extremadura",         type:"normal",   v2026:1055342,  v2041:1007474},
  {name:"Galicia",             type:"normal",   v2026:2728034,  v2041:2713065},
  {name:"Madrid",              type:"normal",   v2026:7169262,  v2041:8204833},
  {name:"Murcia",              type:"normal",   v2026:1605736,  v2041:1802032},
  {name:"Navarra",             type:"normal",   v2026:689973,   v2041:753129},
  {name:"País Vasco",          type:"normal",   v2026:2252857,  v2041:2298897},
  {name:"La Rioja",            type:"normal",   v2026:329499,   v2041:352356},
  {name:"Ceuta",               type:"normal",   v2026:84208,    v2041:82559},
  {name:"Melilla",             type:"normal",   v2026:86896,    v2041:87781}
];

var data = regions.map(function(r){
  return {
    region: r.name,
    type: r.type,
    variation: +((r.v2041 - r.v2026) / r.v2026 * 100).toFixed(2)
  };
}).sort(function(a,b){ return b.variation - a.variation; });

function colorFor(type){
  if(type === "ib") return "#D97A53";
  if(type === "national") return "#16323A";
  return "#A9BCC1";
}

var ctx = document.getElementById('canvasBar').getContext('2d');
new Chart(ctx, {
  type: 'bar',
  data: {
    labels: data.map(function(d){ return d.region; }),
    datasets: [{
      data: data.map(function(d){ return d.variation; }),
      backgroundColor: data.map(function(d){ return colorFor(d.type); }),
      borderWidth: 0,
      borderRadius: 3,
      barPercentage: 0.7
    }]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: {display:false},
      tooltip: {
        callbacks: {
          label: function(ctx){ return fmt(ctx.parsed.x) + '%'; }
        }
      }
    },
    scales: {
      x: {
        title: {display:true, text:'Variación de población (%)', font:{size:12}},
        ticks: { callback: function(v){ return fmt(v) + '%'; }, font:{size:11} },
        grid: { color: "#DCE3E1" }
      },
      y: {
        ticks: { font:{size:12}, color:"#16323A" },
        grid: { display:false }
      }
    }
  }
});
</script>
</body>
</html>
