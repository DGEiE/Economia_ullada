<!DOCTYPE html>
<html lang="ca" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piràmide de població · Formentera vs Illes Balears, 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root{
    --fom:#387a94; --ib:#40b6e4;
    --ink:#2a2a2a; --muted:#6f6f6f; --hair:#ececec; --bg:#fff;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--ink);
    font-family:"Roboto",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto}
  h1{font-size:18px;font-weight:700;margin:0 0 5px;line-height:1.25;letter-spacing:-.2px}
  .sub{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.4}
  .legend{display:flex;gap:18px;font-size:12px;color:var(--muted);margin:0 0 6px;align-items:center}
  .legend span{display:flex;align-items:center;gap:7px}
  .sw{width:13px;height:13px;border-radius:2px;background:var(--fom)}
  .sw.l{width:15px;height:0;background:none;border-top:3px solid var(--ib)}
  .note{font-size:11px;color:var(--muted);margin:12px 0 0;line-height:1.45}
  .note a{color:var(--fom);text-decoration:none}
  .note a:hover{text-decoration:underline}
  .foot{display:flex;justify-content:space-between;align-items:baseline;
    flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:8px;
    border-top:1px solid var(--hair);font-size:10.5px;color:var(--muted)}
  .foot .left{line-height:1.4}
  .foot .left a{color:var(--fom);text-decoration:none}
  .foot .left a:hover{text-decoration:underline}
  .foot .right a{color:var(--muted);text-decoration:none;display:inline-flex;
    align-items:center;gap:4px}
  .foot .right a:hover{color:var(--fom)}
  .foot .credit{font-weight:500}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .glabel{fill:var(--muted);font-size:11px}
  .hd{fill:var(--muted);font-size:11px;font-weight:500;letter-spacing:.3px}
  .bar{fill:var(--fom)}
  .bar:hover{fill:#2f6a82}
  .track{fill:#f2f2f2}
  .barval{fill:#fff;font-size:10.5px;font-weight:500;pointer-events:none}
  .ibmark{stroke:var(--ib);stroke-width:2.5;stroke-linecap:round;pointer-events:none}
  .ibline{fill:none;stroke:var(--ib);stroke-width:2;stroke-linejoin:round;pointer-events:none}
  .ibdot{fill:#fff;stroke:var(--ib);stroke-width:1.5;pointer-events:none}

  .tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .12s;
    background:#fff;border:1px solid var(--hair);border-radius:8px;
    box-shadow:0 6px 20px rgba(0,0,0,.14);padding:11px 13px;font-size:12px;z-index:20;min-width:180px}
  .tip .age{font-weight:700;font-size:13px;margin-bottom:8px;color:var(--ink)}
  .tip .block{margin-bottom:7px}
  .tip .block:last-child{margin-bottom:0}
  .tip .head{font-weight:700;font-size:11.5px;padding-bottom:2px;margin-bottom:3px;
    display:inline-block;border-bottom:2px solid}
  .tip .head.f{color:var(--fom);border-color:var(--fom)}
  .tip .head.i{color:var(--ib);border-color:var(--ib)}
  .tip .row{display:flex;justify-content:space-between;gap:18px;line-height:1.5}
  .tip .k{color:var(--muted)}
  .tip .v{font-weight:500;color:var(--ink)}
</style>

</head>
<body>
<div class="wrap">
  <h1>Formentera concentra més població en edat laboral que Balears</h1>
  <p class="sub">Estructura de la població per edat i sexe, 2025</p>
  <div class="legend">
    <span><span class="sw"></span>Formentera</span>
    <span><span class="sw l"></span>Perfil Illes Balears</span>
  </div>
  <div id="chart"></div>
  <div class="foot">
    <div class="left">
      Percentatge sobre la població total de cada àmbit. Font: <a href="https://www.ine.es/dyngs/INEbase/operacion.htm?c=Estadistica_C&cid=1254736177095&menu=resultados&idp=1254735572981" target="_blank" rel="noopener">INE</a>.<br>
      <span class="credit">Gràfic: Direcció General d'Economia i Estadística</span>
    </div>
    <div class="right">
      <a id="dl" href="#">↓ Descarregar les dades</a>
    </div>
  </div>
</div>

<script>
// ordre natural del array: 0-4 ... 85+
const data=[
 {g:"0-4",  fh:1.70,fd:1.53, ibh:1.93,ibd:1.84, efh:199,efd:179},
 {g:"5-9",  fh:2.25,fd:1.75, ibh:2.34,ibd:2.20, efh:263,efd:205},
 {g:"10-14",fh:2.14,fd:2.22, ibh:2.56,ibd:2.44, efh:250,efd:259},
 {g:"15-19",fh:2.19,fd:1.94, ibh:2.78,ibd:2.55, efh:256,efd:227},
 {g:"20-24",fh:2.50,fd:2.36, ibh:2.93,ibd:2.79, efh:292,efd:276},
 {g:"25-29",fh:3.38,fd:3.40, ibh:3.21,ibd:3.14, efh:395,efd:398},
 {g:"30-34",fh:3.75,fd:4.08, ibh:3.55,ibd:3.45, efh:438,efd:477},
 {g:"35-39",fh:4.49,fd:4.52, ibh:3.71,ibd:3.61, efh:525,efd:528},
 {g:"40-44",fh:5.26,fd:4.60, ibh:4.09,ibd:3.97, efh:615,efd:538},
 {g:"45-49",fh:5.29,fd:4.39, ibh:4.45,ibd:4.21, efh:618,efd:513},
 {g:"50-54",fh:5.00,fd:4.19, ibh:4.18,ibd:3.99, efh:584,efd:490},
 {g:"55-59",fh:3.98,fd:3.76, ibh:3.59,ibd:3.55, efh:465,efd:440},
 {g:"60-64",fh:3.11,fd:2.74, ibh:2.99,ibd:3.11, efh:363,efd:320},
 {g:"65-69",fh:2.16,fd:1.96, ibh:2.35,ibd:2.60, efh:252,efd:229},
 {g:"70-74",fh:1.42,fd:1.62, ibh:1.89,ibd:2.14, efh:166,efd:189},
 {g:"75-79",fh:1.32,fd:1.51, ibh:1.53,ibd:1.83, efh:154,efd:177},
 {g:"80-84",fh:0.82,fd:0.88, ibh:0.98,ibd:1.31, efh:96,efd:103},
 {g:"85+",  fh:0.68,fd:1.13, ibh:0.76,ibd:1.46, efh:79,efd:132}
];

const fmtES=n=>d3.format(",.0f")(n).replace(/,/g,"."),
      pc=n=>n.toFixed(2).replace(".",",")+"%",
      pc1=n=>n.toFixed(1).replace(".",",")+"%";   // valor dins barra amb signe %

const W=680,H=520,
      m={top:52,right:16,bottom:16,left:46},
      iw=W-m.left-m.right,
      colGap=14,
      colW=(iw-colGap)/2,
      ih=H-m.top-m.bottom;

const xMax=6;
// PIRÀMIDE ESTÀNDARD: joves a BAIX, grans a DALT.
// invertim el domini de la banda perquè 0-4 quedi a baix i 85+ a dalt:
const y=d3.scaleBand().domain(data.map(d=>d.g).reverse()).range([0,ih]).padding(0.24);
const xL=d3.scaleLinear().domain([0,xMax]).range([colW,0]);
const xR=d3.scaleLinear().domain([0,xMax]).range([0,colW]);

const svg=d3.select("#chart").append("svg")
  .attr("viewBox",`0 0 ${W} ${H}`).attr("role","img")
  .attr("aria-label","Piràmide de població de Formentera 2025, joves a baix i grans a dalt, amb el perfil d'Illes Balears superposat. Formentera té més pes de població de 25 a 54 anys i menys base infantil i gent gran que el conjunt balear.");

const gL=svg.append("g").attr("transform",`translate(${m.left},${m.top})`);
const gR=svg.append("g").attr("transform",`translate(${m.left+colW+colGap},${m.top})`);

// capçaleres
svg.append("text").attr("class","hd").attr("x",m.left+colW/2).attr("y",m.top-18)
  .attr("text-anchor","middle").text("HOMES");
svg.append("text").attr("class","hd").attr("x",m.left+colW+colGap+colW/2).attr("y",m.top-18)
  .attr("text-anchor","middle").text("DONES");

// eix Y (edat) a l'esquerra, sense línia
const axY=d3.axisLeft(y).tickSize(0).tickPadding(8);
gL.append("g").attr("class","glaxis").call(axY);
gL.select(".glaxis").select(".domain").remove();
gL.select(".glaxis").selectAll("text").attr("class","glabel");

const tip=d3.select("body").append("div").attr("class","tip");
function show(ev,d){
  tip.html(
    `<div class="age">${d.g} anys</div>`+
    `<div class="block">`+
      `<div class="head f">Formentera</div>`+
      `<div class="row"><span class="k">Homes</span><span class="v">${pc(d.fh)} · ${fmtES(d.efh)}</span></div>`+
      `<div class="row"><span class="k">Dones</span><span class="v">${pc(d.fd)} · ${fmtES(d.efd)}</span></div>`+
    `</div>`+
    `<div class="block">`+
      `<div class="head i">Illes Balears</div>`+
      `<div class="row"><span class="k">Homes</span><span class="v">${pc(d.ibh)}</span></div>`+
      `<div class="row"><span class="k">Dones</span><span class="v">${pc(d.ibd)}</span></div>`+
    `</div>`
  ).style("opacity",1);
  move(ev);
}
function move(ev){
  const pad=14,r=tip.node().getBoundingClientRect();
  let x=ev.clientX+pad,yy=ev.clientY+pad;
  if(x+r.width>innerWidth)x=ev.clientX-r.width-pad;
  if(yy+r.height>innerHeight)yy=ev.clientY-r.height-pad;
  tip.style("left",x+"px").style("top",yy+"px");
}
const hide=()=>tip.style("opacity",0);

// TRACKS (carril gris pàlid darrere de cada barra, fins al màxim de l'escala)
// homes: del centre (x=colW) fins a l'extrem esquerre (x=0)
gL.selectAll(".track").data(data).join("rect").attr("class","track")
  .attr("x",0).attr("y",d=>y(d.g))
  .attr("width",colW).attr("height",y.bandwidth()).attr("rx",1.5);
// dones: del centre (x=0) fins a l'extrem dret (x=colW)
gR.selectAll(".track").data(data).join("rect").attr("class","track")
  .attr("x",0).attr("y",d=>y(d.g))
  .attr("width",colW).attr("height",y.bandwidth()).attr("rx",1.5);

// barres homes
gL.selectAll(".bar").data(data).join("rect").attr("class","bar")
  .attr("x",d=>xL(d.fh)).attr("y",d=>y(d.g))
  .attr("width",d=>colW-xL(d.fh)).attr("height",y.bandwidth()).attr("rx",1.5)
  .on("mouseenter",show).on("mousemove",move).on("mouseleave",hide);
// barres dones
gR.selectAll(".bar").data(data).join("rect").attr("class","bar")
  .attr("x",0).attr("y",d=>y(d.g))
  .attr("width",d=>xR(d.fd)).attr("height",y.bandwidth()).attr("rx",1.5)
  .on("mouseenter",show).on("mousemove",move).on("mouseleave",hide);

// VALORS a l'INICI INTERIOR de la barra (tocant el centre), amb signe %
// homes: la barra va de dreta(centre) cap a l'esquerra -> inici = costat dret (x=colW)
gL.selectAll(".barval").data(data).join("text").attr("class","barval")
  .attr("x",colW-5).attr("y",d=>y(d.g)+y.bandwidth()/2).attr("dy","0.34em")
  .attr("text-anchor","end").text(d=>pc1(d.fh));
// dones: la barra va des del centre(x=0) cap a la dreta -> inici = costat esquerre (x=0)
gR.selectAll(".barval").data(data).join("text").attr("class","barval")
  .attr("x",5).attr("y",d=>y(d.g)+y.bandwidth()/2).attr("dy","0.34em")
  .attr("text-anchor","start").text(d=>pc1(d.fd));

// PERFIL IB com a LÍNIA CONTÍNUA (silueta), amb punt a cada grup
// El centre vertical de cada barra és el punt d'ancoratge (y)
const yc=d=>y(d.g)+y.bandwidth()/2;
const lineH=d3.line().x(d=>xL(d.ibh)).y(d=>yc(d));
const lineD=d3.line().x(d=>xR(d.ibd)).y(d=>yc(d));

gL.append("path").datum(data).attr("class","ibline").attr("d",lineH);
gR.append("path").datum(data).attr("class","ibline").attr("d",lineD);

gL.selectAll(".ibdot").data(data).join("circle").attr("class","ibdot")
  .attr("cx",d=>xL(d.ibh)).attr("cy",d=>yc(d)).attr("r",2.4);
gR.selectAll(".ibdot").data(data).join("circle").attr("class","ibdot")
  .attr("cx",d=>xR(d.ibd)).attr("cy",d=>yc(d)).attr("r",2.4);

// DESCÀRREGA DE DADES (CSV format europeu: ; separador, coma decimal)
document.getElementById("dl").addEventListener("click",function(ev){
  ev.preventDefault();
  const dec=n=>String(n).replace(".",",");
  const head=["grup edat","% Formentera homes","% Formentera dones",
    "% Illes Balears homes","% Illes Balears dones",
    "efectius Formentera homes","efectius Formentera dones"];
  const rows=data.map(d=>[d.g,dec(d.fh),dec(d.fd),dec(d.ibh),dec(d.ibd),d.efh,d.efd].join(";"));
  const csv="\uFEFF"+head.join(";")+"\n"+rows.join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="piramide_formentera_vs_IB_2025.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
